<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#0f172a">
    <title>Chat</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
<div id="app"> <!-- App is hidden until logged in -->

    <!-- Header -->
    <header class="chat-header">
        <div class="user-info">
            <div class="avatar" id="peer-avatar">?</div>
            <div class="details">
                <h2 id="peer-name">Connecting...</h2>
                <div style="font-size:0.65rem; color:#22c55e; display:flex; align-items:center; gap:0.2rem; margin-bottom:0.1rem;">
                    <svg viewBox="0 0 24 24" width="10" height="10" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                    Secure Online Chat
                </div>
                <span id="status">Connecting</span>
                <span id="typing-indicator" class="hidden">typing...</span>
            </div>
        </div>
        <div id="self-badge" style="font-size:0.7rem; background:rgba(56,189,248,0.15); border:1px solid rgba(56,189,248,0.3); color:#38bdf8; padding:0.2rem 0.6rem; border-radius:999px; display:none; align-items:center; gap:0.25rem;">
            <span style="font-size:0.6rem;">👤</span>
            You: <strong id="self-name"></strong>
        </div>
        <div class="header-actions">
            <button id="clear-chat-btn" title="Clear Chat">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
                    <path d="M10 11v6"></path><path d="M14 11v6"></path>
                    <path d="M9 6V4h6v2"></path>
                </svg>
            </button>
            <button id="video-call-btn" title="Start Video Call">
                <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 7l-7 5 7 5V7z"></path>
                    <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                </svg>
            </button>
        </div>
    </header>

    <!-- Connection banner -->
    <div id="connecting-banner">Connecting to server...</div>

    <!-- Chat Messages -->
    <main id="chat-messages" role="log" aria-live="polite"></main>

    <!-- Reply Preview Box -->
    <div id="reply-preview" class="hidden">
        <div class="reply-content">
            <div class="reply-sender" id="reply-sender-name"></div>
            <div class="reply-text" id="reply-text-content"></div>
        </div>
        <button id="close-reply-btn">✕</button>
    </div>

    <!-- Footer -->
    <footer class="chat-footer">
        <div class="input-area">
            <button id="media-btn" title="Share Media" class="attach-btn">
                <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                </svg>
            </button>
            <input type="file" id="file-input" accept="image/*,video/*,.pdf,.doc,.docx,.zip" style="display:none">
            <input type="text" id="message-input" placeholder="Message..."
                autocomplete="off" autocorrect="off" autocapitalize="sentences"
                spellcheck="true" enterkeyhint="send">
            <button id="send-btn">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                </svg>
            </button>
        </div>
    </footer>

</div>

<!-- Setup Overlay -->
<div id="setup-overlay" class="modal-overlay hidden">
    <div class="setup-card">
        <h1>💬 Chat App</h1>
        <p>Open your personalized link to start chatting.</p>
        <div class="demo-links">
            <a href="/?user=swaruu&peer=kanha">I'm Swaruu 👨</a>
            <a href="/?user=kanha&peer=swaruu">I'm Kanha 👩</a>
        </div>
    </div>
</div>

<!-- Context Menu -->
<div id="context-menu" class="hidden">
    <button id="ctx-reply">↩️ Reply</button>
    <button id="ctx-delete-me">🗑️ Delete for Me</button>
    <button id="ctx-delete-all">🗑️ Delete for Everyone</button>
</div>

<!-- Outgoing Call Modal -->
<div id="outgoing-call-modal" class="call-screen hidden">
    <div class="call-content">
        <h2 id="outgoing-status">Calling...</h2>
        <div class="call-avatar-wrapper">
            <div class="call-avatar" id="outgoing-avatar">?</div>
            <div class="pulse-ring"></div>
            <div class="pulse-ring delay"></div>
        </div>
        <h3 id="outgoing-name">Someone</h3>
        <div class="modal-actions">
            <button id="cancel-call-btn" class="btn-decline">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                    <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z" transform="rotate(135 12 12)"/>
                </svg>
            </button>
        </div>
    </div>
</div>

<!-- Incoming Call Modal -->
<div id="incoming-call-modal" class="call-screen hidden">
    <div class="call-content">
        <h2>Incoming Video Call</h2>
        <div class="call-avatar-wrapper">
            <div class="call-avatar" id="caller-avatar">?</div>
            <div class="pulse-ring"></div>
            <div class="pulse-ring delay"></div>
        </div>
        <h3 id="caller-name">Someone</h3>
        <div class="modal-actions dual">
            <button id="decline-call-btn" class="btn-decline">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                    <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z" transform="rotate(135 12 12)"/>
                </svg>
            </button>
            <button id="accept-call-btn" class="btn-accept pulse-green">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                    <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/>
                </svg>
            </button>
        </div>
    </div>
</div>

<!-- Fullscreen Video Overlay -->
<div id="video-overlay" class="hidden">
    <video id="remote-video" autoplay playsinline></video>
    <video id="local-video"  autoplay playsinline muted></video>
    <div class="video-top-bar">
        <span id="call-peer-name">Call</span>
        <span id="call-timer">00:00</span>
    </div>
    <div class="video-controls">
        <button id="btn-flip-cam" class="vc-btn">Flip</button>
        <button id="btn-speaker" class="vc-btn">Spkr</button>
        <button id="btn-mute" class="vc-btn">Mute</button>
        <button id="btn-end-call" class="vc-btn vc-end">End</button>
        <button id="btn-toggle-cam" class="vc-btn">Cam</button>
        <button id="btn-fullscreen" class="vc-btn">Full</button>
    </div>
</div>

<div id="lightbox" class="hidden">
    <button id="lightbox-close">✕</button>
    <img id="lightbox-img" src="" alt="Full size">
</div>

<script src="script.js"></script>
</body>
</html>
