<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#0f172a">
    <title>Chat</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
<div id="app" class="hidden"> <!-- App is hidden until logged in -->

    <!-- Header -->
    <header class="chat-header">
        <div class="user-info">
            <div class="avatar" id="peer-avatar">?</div>
            <div class="details">
                <h2 id="peer-name">Connecting...</h2>
                <span id="status">Connecting</span>
                <span id="typing-indicator" class="hidden">typing...</span>
            </div>
        </div>
        <div class="header-actions">
            <button id="clear-chat-btn" title="Clear Chat">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
                    <path d="M10 11v6"></path><path d="M14 11v6"></path>
                    <path d="M9 6V4h6v2"></path>
                </svg>
            </button>
            <button id="video-call-btn" title="Start Video Call">
                <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 7l-7 5 7 5V7z"></path>
                    <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                </svg>
            </button>
        </div>
    </header>

    <!-- Connection banner -->
    <div id="connecting-banner">Connecting to server...</div>

    <!-- Chat Messages -->
    <main id="chat-messages" role="log" aria-live="polite"></main>

    <!-- Reply Preview Box -->
    <div id="reply-preview" class="hidden">
        <div class="reply-content">
            <div class="reply-sender" id="reply-sender-name"></div>
            <div class="reply-text" id="reply-text-content"></div>
        </div>
        <button id="close-reply-btn">✕</button>
    </div>

    <!-- Footer -->
    <footer class="chat-footer">
        <div class="input-area">
            <button id="media-btn" title="Share Media" class="attach-btn">
                <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                </svg>
            </button>
            <input type="file" id="file-input" accept="image/*,video/*,.pdf,.doc,.docx,.zip" style="display:none">
            <input type="text" id="message-input" placeholder="Message..."
                autocomplete="off" autocorrect="off" autocapitalize="sentences"
                spellcheck="true" enterkeyhint="send">
            <button id="send-btn">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                </svg>
            </button>
        </div>
    </footer>

</div>

<!-- Login Overlay -->
<div id="login-overlay" class="modal-overlay hidden">
    <div class="setup-card">
        <h1>🔒 Enter Password</h1>
        <p id="login-welcome-text">Set a password for your account.</p>
        <div class="login-form">
            <input type="password" id="login-password" placeholder="Password" />
            <div id="login-error" class="hidden">Incorrect password!</div>
            <button id="login-btn">Enter Chat</button>
        </div>
    </div>
</div>

<!-- Setup Overlay -->
<div id="setup-overlay" class="modal-overlay hidden">
    <div class="setup-card">
        <h1>💬 Chat App</h1>
        <p>Open your personalized link to start chatting.</p>
        <div class="demo-links">
            <a href="/?user=bhavnesh&peer=snehal">I'm Bhavnesh 👨</a>
            <a href="/?user=snehal&peer=bhavnesh">I'm Snehal 👩</a>
        </div>
    </div>
</div>

<!-- Context Menu -->
<div id="context-menu" class="hidden">
    <button id="ctx-reply">↩️ Reply</button>
    <button id="ctx-delete-me">🗑️ Delete for Me</button>
    <button id="ctx-delete-all">🗑️ Delete for Everyone</button>
</div>

<!-- Incoming Call Modal -->
<div id="incoming-call-modal" class="modal-overlay hidden">
    <div class="modal-card">
        <div class="call-avatar" id="caller-avatar">?</div>
        <h3 id="caller-name">Someone</h3>
        <p>is calling you...</p>
        <div class="modal-actions">
            <button id="accept-call-btn" class="btn-accept">Accept</button>
            <button id="decline-call-btn" class="btn-decline">Decline</button>
        </div>
    </div>
</div>

<!-- Fullscreen Video Overlay -->
<div id="video-overlay" class="hidden">
    <video id="remote-video" autoplay playsinline></video>
    <video id="local-video"  autoplay playsinline muted></video>
    <div class="video-top-bar">
        <span id="call-peer-name">Call</span>
        <span id="call-timer">00:00</span>
    </div>
    <div class="video-controls">
        <button id="btn-flip-cam" class="vc-btn">Flip</button>
        <button id="btn-mute" class="vc-btn">Mute</button>
        <button id="btn-end-call" class="vc-btn vc-end">End</button>
        <button id="btn-toggle-cam" class="vc-btn">Cam</button>
        <button id="btn-fullscreen" class="vc-btn">Full</button>
    </div>
</div>

<div id="lightbox" class="hidden">
    <button id="lightbox-close">✕</button>
    <img id="lightbox-img" src="" alt="Full size">
</div>

<script src="script.js"></script>
</body>
</html>
