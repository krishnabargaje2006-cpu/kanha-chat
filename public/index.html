<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Chat</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="dark-theme">
    <div id="app">
        <!-- Header -->
        <header class="chat-header">
            <div class="user-info">
                <div class="avatar" id="peer-avatar">S</div>
                <div class="details">
                    <h2 id="peer-name">Loading...</h2>
                    <span id="status">Online</span>
                </div>
            </div>
            <div class="header-actions">
                <button id="video-call-btn" title="Start Video Call">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"></path><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
                </button>
            </div>
        </header>

        <!-- Video Section -->
        <div id="video-container" class="hidden">
            <div class="video-wrapper">
                <video id="remote-video" autoplay playsinline></video>
                <video id="local-video" autoplay playsinline muted></video>
                <div class="video-overlay-controls">
                    <button id="end-call-btn">End Call</button>
                </div>
            </div>
        </div>

        <!-- Chat Area -->
        <main id="chat-messages">
            <!-- Messages injected here -->
        </main>

        <!-- Footer -->
        <footer class="chat-footer">
            <div class="input-area">
                <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
                <button id="send-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
                </button>
            </div>
        </footer>
    </div>

    <!-- Error/Join Overlay (if no params) -->
    <div id="setup-overlay" class="hidden">
        <div class="setup-card">
            <h1>Welcome to Chat</h1>
            <p>Please use a personalized link to join.</p>
            <div class="demo-links">
                <a id="link-bhavnesh" href="/?user=bhavnesh&peer=snehal">Login as Bhavnesh</a>
                <a id="link-snehal" href="/?user=snehal&peer=bhavnesh">Login as Snehal</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
