<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#0f172a">
    <title>Chat</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
<div id="app">

    <!-- Header -->
    <header class="chat-header">
        <div class="user-info">
            <div class="avatar" id="peer-avatar">?</div>
            <div class="details">
                <h2 id="peer-name">Connecting...</h2>
                <span id="status">Connecting</span>
            </div>
        </div>
        <div class="header-actions">
            <button id="clear-chat-btn" title="Clear Chat">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
                    <path d="M10 11v6"></path><path d="M14 11v6"></path>
                    <path d="M9 6V4h6v2"></path>
                </svg>
            </button>
            <button id="video-call-btn" title="Start Video Call">
                <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 7l-7 5 7 5V7z"></path>
                    <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                </svg>
            </button>
        </div>
    </header>

    <!-- Connection banner -->
    <div id="connecting-banner">Connecting to server...</div>

    <!-- Chat Messages -->
    <main id="chat-messages" role="log" aria-live="polite"></main>

    <!-- Footer -->
    <footer class="chat-footer">
        <div class="input-area">
            <button id="media-btn" title="Share Media" class="attach-btn">
                <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                </svg>
            </button>
            <input type="file" id="file-input" accept="image/*,video/*,.pdf,.doc,.docx,.zip" style="display:none">
            <input type="text" id="message-input" placeholder="Message..."
                autocomplete="off" autocorrect="off" autocapitalize="sentences"
                spellcheck="true" enterkeyhint="send">
            <button id="send-btn">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                </svg>
            </button>
        </div>
    </footer>

</div>

<!-- Context Menu (right-click / long-press on message) -->
<div id="context-menu" class="hidden">
    <button id="ctx-delete-me">🗑️ Delete for Me</button>
    <button id="ctx-delete-all">🗑️ Delete for Everyone</button>
</div>

<!-- Incoming Call Modal -->
<div id="incoming-call-modal" class="modal-overlay hidden">
    <div class="modal-card">
        <div class="call-avatar" id="caller-avatar">?</div>
        <h3 id="caller-name">Someone</h3>
        <p>is calling you...</p>
        <div class="modal-actions">
            <button id="accept-call-btn" class="btn-accept">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>
                Accept
            </button>
            <button id="decline-call-btn" class="btn-decline">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M19.59 7l-7.6 7.6a2 2 0 0 1-2.82 0l-7.6-7.6L3 5.59A2 2 0 0 1 5.59 3l7.6 7.6a2 2 0 0 0 2.82 0L23.41 3A2 2 0 0 1 26 5.59L19.59 7z" transform="rotate(135 12 12)"/></svg>
                Decline
            </button>
        </div>
    </div>
</div>

<!-- Fullscreen Video Call UI -->
<div id="video-overlay" class="hidden">
    <video id="remote-video" autoplay playsinline></video>
    <video id="local-video"  autoplay playsinline muted></video>

    <!-- Top bar inside video -->
    <div class="video-top-bar">
        <span id="call-peer-name">Call</span>
        <span id="call-timer">00:00</span>
    </div>

    <!-- Video Controls -->
    <div class="video-controls">
        <button id="btn-flip-cam" class="vc-btn" title="Flip Camera">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                <path d="M1 4v6h6"/><path d="M23 20v-6h-6"/>
                <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
            </svg>
            <span>Flip</span>
        </button>
        <button id="btn-mute" class="vc-btn" title="Mute Mic">
            <svg id="mic-icon" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/>
                <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
            <span>Mute</span>
        </button>
        <button id="btn-end-call" class="vc-btn vc-end" title="End Call">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z" transform="rotate(135 12 12)"/>
            </svg>
            <span>End</span>
        </button>
        <button id="btn-toggle-cam" class="vc-btn" title="Toggle Camera">
            <svg id="cam-icon" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                <path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
            </svg>
            <span>Camera</span>
        </button>
        <button id="btn-fullscreen" class="vc-btn" title="Fullscreen">
            <svg id="fs-icon" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
            </svg>
            <span>Full</span>
        </button>
    </div>
</div>

<!-- Setup Overlay -->
<div id="setup-overlay" class="hidden">
    <div class="setup-card">
        <h1>💬 Chat App</h1>
        <p>Open your personalized link to start chatting.</p>
        <div class="demo-links">
            <a href="/?user=bhavnesh&peer=snehal">I'm Bhavnesh 👨</a>
            <a href="/?user=snehal&peer=bhavnesh">I'm Snehal 👩</a>
        </div>
    </div>
</div>

<!-- Image Lightbox -->
<div id="lightbox" class="hidden">
    <button id="lightbox-close">✕</button>
    <img id="lightbox-img" src="" alt="Full size">
</div>

<script src="script.js"></script>
</body>
</html>
