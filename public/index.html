<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#0f172a">
    <title>Chat</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div id="app">

        <!-- Header -->
        <header class="chat-header">
            <div class="user-info">
                <div class="avatar" id="peer-avatar">?</div>
                <div class="details">
                    <h2 id="peer-name">Connecting...</h2>
                    <span id="status">Connecting</span>
                </div>
            </div>
            <div class="header-actions">
                <button id="video-call-btn" title="Start Video Call" aria-label="Start Video Call">
                    <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 7l-7 5 7 5V7z"></path>
                        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Connection banner -->
        <div id="connecting-banner">Connecting to server...</div>

        <!-- Video Section (hidden by default) -->
        <div id="video-container" class="hidden">
            <div class="video-wrapper">
                <video id="remote-video" autoplay playsinline></video>
                <video id="local-video" autoplay playsinline muted></video>
                <div class="video-overlay-controls">
                    <button id="end-call-btn">End Call</button>
                </div>
            </div>
        </div>

        <!-- Chat Area -->
        <main id="chat-messages" role="log" aria-live="polite"></main>

        <!-- Footer Input -->
        <footer class="chat-footer">
            <div class="input-area">
                <input
                    type="text"
                    id="message-input"
                    placeholder="Message..."
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="sentences"
                    spellcheck="true"
                    enterkeyhint="send"
                >
                <button id="send-btn" aria-label="Send message">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                    </svg>
                </button>
            </div>
        </footer>

    </div>

    <!-- Setup Overlay (shown if no URL params) -->
    <div id="setup-overlay" class="hidden" role="dialog" aria-label="Choose your identity">
        <div class="setup-card">
            <h1>💬 Chat App</h1>
            <p>Open your personalized link to start chatting.</p>
            <div class="demo-links">
                <a href="/?user=bhavnesh&peer=snehal">I'm Bhavnesh 👨</a>
                <a href="/?user=snehal&peer=bhavnesh">I'm Snehal 👩</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
